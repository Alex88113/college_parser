[project]
name = "journal-parser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.28.2",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "uvicorn[standard]>=0.49.0",
    "asyncpg>=0.31.0",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "booktype>=1.5",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.1.0",
    "pytest[env]>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-env>=1.6.0",
    "ruff>=0.15.13",
    "respx>=0.23.1",
]
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Базовый набор правил
select = [
    "E",   # pycodestyle errors (базовые ошибки стиля)
    "F",   # Pyflakes (неиспользуемые импорты, переменные)
    "I",   # isort (сортировка импортов)
    "UP",  # pyupgrade (современный синтаксис для твоей версии Python)
    "B",   # flake8-bugbear (поиск часто встречающихся багов)
    "C4",  # flake8-comprehensions (улучшение генераторов списков/словарей)
    "SIM", # flake8-simplify (упрощение кода)
    "TCH", # flake8-type-checking (правильный импорт для типов)
]
ignore = ["E501"]  # Игнорируем длину строки (это делает форматтер)

[tool.ruff.lint.per-file-ignores]
# В тестах можно использовать магические числа и игнорировать некоторые правила
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
# Строгие проверки для бэкенда
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
# Игнорируем импорты без типов (например, aiogram, booktype)
ignore_missing_imports = true
pretty = true

# Можно исключить папки из проверки mypy
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
include:
  - path: ./infra.yaml

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app_network
    depends_on:
      - web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M

  web:
    build: .
    ports:
      - "${FASTAPI_PORT}:8000"
    env_file:
      - .env
    environment:
      - FASTAPI_HOST=${FASTAPI_HOST}
      - DATABASE_URL=postgresql://${PSQL_NAME}:${PSQL_PASSWORD}@postgresql:5432/${COLLEGE_DATABASE}
    volumes:
      - .:/code
    depends_on:
      db:
        condition: service_healthy
        restart: true
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /code
        - action: rebuild
          path: requirements.txt
    networks:
      - app_network
    restart: unless-stopped
    deploy:
        resources:
          limits:
            cpus: '1.0'
            memory: 512M
          reservations:
            cpus: '0.25'
            memory: 256M
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - app_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

volumes:
  postgres-data:
  grafana_data:
  prometheus_data:

networks:
  app_network:
    driver: bridge

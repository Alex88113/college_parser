include:
  - path: ./infra.yaml

services:
  web:
    build: .
    ports:
      - "${FASTAPI_PORT}:8000"
    env_file:
      - .env
    environment:
      - FASTAPI_HOST=${FASTAPI_HOST}
      - DATABASE_URL=postgresql://${PSQL_NAME}:${PSQL_PASSWORD}@postgresql:5432/${COLLEGE_DATABASE}
    volumes:
      - .:/code
    depends_on:
      postgresql:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /code
        - action: rebuild
          path: requirements.txt

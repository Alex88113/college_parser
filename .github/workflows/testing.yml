name: CI/CD for Testing

on:
  push:
    branches:
      - master
      - dev-branch

jobs:
  test:
    name: 🧪 Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12.10']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies with uv
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-testing.txt

      - name: Create .env from secret
        run: |
          if [ -z "${{ secrets.SECRETS_TESTING }}" ]; then
            echo "❌ SECRETS_TESTING is empty!"
            exit 1
          fi
          echo "${{ secrets.SECRETS_TESTING }}" > .env
          echo "✅ .env created successfully"

      - name: Debug .env (remove after testing)
        run: cat .env

      - name: Run tests
        run: pytest tests/ -v

name: CI/CD for Testing

on:
  push:
    branches:
      - master
      - dev-branch

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12.10']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies with uv
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-testing.txt

      - name: Create .env from secret
        run: echo "${{ secrets.SECRETS_TESTING }}" > .env

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    - name: Deploy project
      run: |
        echo "🚀 Started deployment to WSL..."
        cd /home/shurik/projects/college_parser

        # Проверяем, что папка существует
        if [ ! -d "/home/shurik/projects/college_parser" ]; then
          echo "❌ Папка не найдена!"
          exit 1
        fi

        echo "📂 Current directory: $(pwd)"
        echo "📦 Stashing local changes..."
        git stash push --include-untracked -m "Auto-stash before deploy"

        echo "📦 Pulling latest changes..."
        git pull origin master

        echo "📦 Applying stashed changes..."
        git stash pop || echo "No stashed changes to apply"

        echo "🐳 Stopping old containers..."
        docker compose down 2>/dev/null || echo "No running containers"

        echo "🐳 Building and starting containers..."
        docker compose up -d --build

        echo "✅ Deployment completed!"
        docker ps

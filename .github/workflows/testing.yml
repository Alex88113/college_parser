name: CI/CD for Testing

on:
  push:
    branches:
      - master
      - dev-branch

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12.10']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies with uv
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-testing.txt

      - name: Create .env from secret
        run: echo "${{ secrets.SECRETS_FOR_TESTING }}" > .env

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    name: Deploy to WSL
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy project
        run: |
          echo "🚀 Started deployment to WSL..."
          
          # ПУТЬ К ТВОЕМУ ПРОЕКТУ
          PROJECT_PATH="/home/shurik/college_parser"
          
          echo "📂 Project path: $PROJECT_PATH"
          
          # Проверяем, что папка существует
          if [ ! -d "$PROJECT_PATH" ]; then
            echo "❌ Папка $PROJECT_PATH не найдена!"
            echo "📂 Клонирую репозиторий..."
            git clone https://github.com/Alex88113/college_parser.git "$PROJECT_PATH"
          fi
          
          cd "$PROJECT_PATH"
          echo "📂 Current directory: $(pwd)"
          
          # Сохраняем локальные изменения перед pull
          echo "📦 Stashing local changes..."
          git stash push --include-untracked -m "Auto-stash before deploy" 2>/dev/null || echo "Nothing to stash"
          
          # Стягиваем последние изменения
          echo "📦 Pulling latest changes from master..."
          git pull origin master
          
          # Восстанавливаем изменения (если были)
          echo "📦 Applying stashed changes..."
          git stash pop 2>/dev/null || echo "No stashed changes to apply"
          
          # Проверяем наличие docker-compose.yml
          if [ -f "docker-compose.yml" ]; then
            echo "🐳 Found docker-compose.yml, using Docker Compose..."
            docker compose down 2>/dev/null || echo "No running containers"
            docker compose up -d --build
          else
            echo "🐳 No docker-compose.yml, using Dockerfile..."
            docker stop college_parser 2>/dev/null || echo "No running container"
            docker rm college_parser 2>/dev/null || echo "No container to remove"
            docker build -t college_parser .
            docker run -d -p 8000:8000 --name college_parser --restart unless-stopped college_parser
          fi
          
          echo "✅ Deployment completed!"
          echo "📊 Running containers:"
          docker ps

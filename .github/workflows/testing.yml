name: CI/CD for Testing

on:
  push:
    branches:
      - master
      - dev-branch

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12.10']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies with uv
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-testing.txt

      - name: Create .env from secret
        run: echo "${{ secrets.SECRETS_FOR_TESTING }}" > .env

      - name: Run tests
        run: pytest tests/ -v

# deployment io at wsl
  deploy:
    name: Deploy to WSL
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy project
        run: |
          echo "🚀 Started deployment to WSL..."
          cd /mnt/c//users/shurik/projects/college_parser
          git pull origin master
          
          # Останавливаем старые контейнеры (если есть)
          echo "🛑 Stopping old containers..."
          docker compose down 2>/dev/null || echo "No running containers"
          
          # Пересобираем и запускаем
          echo "🐳 Building and starting containers..."
          docker compose up -d --build
          
          echo "✅ Deployment completed!"
          docker ps
